# keepalived  
INTERFACE="ens2f1"  
VIP="10.0.33.200/24"  
KEEPALIVED_TAR="keepalived-2.2.7.tar.gz"  
# VIP 抢占模式: true=主恢复后自动回切, false=主恢复后不回切(需手动)
KEEPALIVED_PREEMPT=false
  
#===============================================================================  
# 公共工具函数  
#===============================================================================  
RED='\033[0;31m'  
GREEN='\033[0;32m'  
YELLOW='\033[1;33m'  
NC='\033[0m'  
  
log_info()  { echo -e "${GREEN}[INFO]  $(date '+%Y-%m-%d %H:%M:%S') $1${NC}"; }  
log_warn()  { echo -e "${YELLOW}[WARN]  $(date '+%Y-%m-%d %H:%M:%S') $1${NC}"; }  
log_error() { echo -e "${RED}[ERROR] $(date '+%Y-%m-%d %H:%M:%S') $1${NC}"; }  
  
check_result() {  
    if [ $? -eq 0 ]; then  
        log_info "$1 - 成功"  
    else  
        log_error "$1 - 失败"  
        exit 1  
    fi  
}